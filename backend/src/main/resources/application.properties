spring.application.name=intern-ca-backend
server.port=8080

# --- Datasource -------------------------------------------------------------
# File-backed H2 so the ATS pipeline survives a restart during development.
# Override spring.datasource.* to point at a real database in other environments.
spring.datasource.url=jdbc:h2:file:./data/interndb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 console (http://localhost:8080/h2-console) ---------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JSON -------------------------------------------------------------------
# Jackson 3 (Spring Boot 4) already writes java.time values as ISO-8601 strings,
# which is what the frontend parses, so no serialization overrides are needed.

# --- CORS -------------------------------------------------------------------
# The Vite dev server; consumed by WebConfig.
app.cors.allowed-origins=http://localhost:8081,http://localhost:5173,http://localhost:3000

# --- ATS --------------------------------------------------------------------
# Applications at or above this match score are flagged as strong candidates.
app.ats.strong-match-threshold=60

# --- Logging ----------------------------------------------------------------
logging.level.com.example.demo=INFO
